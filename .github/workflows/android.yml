name: Build Lumina Focus APK
on:
  workflow_dispatch:
  push:
    branches: [lumina-unified]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LuminaFocus-Preview-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Package verification tools
        run: |
          mkdir -p verify-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" verify-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-verification-tools
          path: verify-tools/
  chat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python tests/chat_session.py
      - run: python tests/youtube_filter.py
